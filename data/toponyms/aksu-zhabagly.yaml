etymology:
  - gloss: Ақсу — «белая вода»; Жабағылы — «(место) с жеребятами-годовиками»
    language: kazakh
    analysis: >-
      Заповедник (1926, старейший в Средней Азии) назван по двум рекам.
      Ақсу: ақ «белый» + су «вода» — мутно-белая ледниковая вода.
      Жабағылы: жабағы «жеребёнок-годовик; свалявшаяся шерсть» + -лы —
      мотивация неясна, возможно по пастбищам.
    reliability: medium
    source: koichubaev-1974
morphemes:
