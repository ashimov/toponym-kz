etymology:
  - gloss: «крепость Святого Петра (и Павла)»
    language: russian
    analysis: >-
      Заложена в 1752 г. как крепость Святого Петра на Пресногорьковской
      линии; название по церкви Петра и Павла. Каз. Петропавл — адаптация.
    reliability: high
    source: pospelov-2002
  - gloss: Қызылжар — «красный яр»
    language: kazakh
    analysis: >-
      Қызыл «красный» + жар «обрыв, крутой берег»: по обрывистому берегу
      Есиля (Ишима). Историческое казахское название места.
    reliability: high
    source: konkashpaev-1963
    note: Относится к форме Қызылжар.
