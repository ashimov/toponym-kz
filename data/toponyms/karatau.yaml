etymology:
  - gloss: «чёрные горы»
    language: kazakh
    analysis: >-
      Қара «чёрный» + тау «гора». В тюркской оронимии «чёрными» называют
      невысокие, бесснежные, тёмные от растительности горы в
      противоположность «белым» (ақ) снежным.
    reliability: high
