id: betpakdala
names:
  kk_cyr: Бетпақдала
  kk_lat: Betpaqdala
  ru: Бетпак-Дала
  en: Betpak-Dala
type: desert
coords: [46.0, 70.0]
layer: hybrid
status: draft
etymology:
  - gloss: «злосчастная степь»
    language: persian + kazakh
    analysis: >-
      Бетпақ ← перс. bad-baxt «несчастный, злосчастный» + каз. дала
      «степь». Русское «Голодная степь» — смысловая калька.
    reliability: medium
    source: koichubaev-1974
  - gloss: бет «лицо» + пақ «чистый»
    language: kazakh
    analysis: Народная этимология по внешнему сходству компонентов.
    reliability: folk
    source: null
morphemes:
  - { form: "бетпақ", gloss: "злосчастный (перс. bad-baxt)", kind: root }
  - { form: "дала", gloss: "степь", kind: term }
historical_forms:
  - form: Голодная степь
    script: cyrillic
    language: russian
    from: 1800
    to: 1950
    official: false
    note: Русское описательное название; так же называли и Мирзачуль в Узбекистане.
  - form: Бетпак-Дала
    script: cyrillic
    language: russian
    from: 1900
    to: null
    official: true
