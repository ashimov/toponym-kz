etymology:
  - gloss: «пёстрые горы (за) Или»
    language: kazakh
    analysis: >-
      Ала «пёстрый» + тау «гора»: горы с чередованием снежных вершин,
      скал и лесов. Іле — по реке Или (этимология гидронима отдельная).
      Русск. «Заилийский» — калька положения «за Или» с точки зрения
      подходивших с севера.
    reliability: high
    source: murzaev-1984
morphemes:
  - { form: "ала", gloss: "пёстрый", kind: root }
  - { form: "тау", gloss: "гора", kind: term }
