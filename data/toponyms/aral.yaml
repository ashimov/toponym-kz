etymology:
  - gloss: «море островов»
    language: turkic
    analysis: >-
      Арал «остров» (общетюрк.): «островное море», по множеству островов
      в былой акватории. Первоначально, вероятно, название дельты Амударьи
      (Арал), перенесённое на море.
    reliability: high
    source: murzaev-1984
