etymology:
  - gloss: «красная столица»
    language: kazakh (советское образование)
    analysis: >-
      Қызыл «красный» + орда «ставка, столица». Дано в 1925 г. при переносе
      столицы Казахской АССР; «красный» — в революционном значении.
      Тюркский материал, советская мотивация.
    reliability: high
    source: pospelov-2002
  - gloss: Ақмешіт — «белая мечеть»
    language: kazakh
    analysis: Ақ «белый» + мешіт «мечеть» (арабизм). Относится к прежней форме.
    reliability: high
    source: koichubaev-1974
    note: Относится к форме Ақмешіт.
morphemes:
  - { form: "қызыл", gloss: "красный", kind: root }
  - { form: "орда", gloss: "ставка, столица", kind: term }
