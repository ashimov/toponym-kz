etymology:
  - gloss: «устье Каменных гор»
    language: russian
    analysis: >-
      Крепость Усть-Каменная заложена в 1720 г. там, где Иртыш выходит из
      гор («Каменных гор»). Каз. Өскемен — фонетическая адаптация
      «Усть-Камен(ь)», не имеет самостоятельной казахской этимологии.
    reliability: high
    source: pospelov-2002
  - gloss: Өскемен ← өс- «расти» + кемен «корабль»
    language: kazakh
    analysis: Народная этимология, возникшая уже на базе адаптированной формы.
    reliability: folk
    source: null
