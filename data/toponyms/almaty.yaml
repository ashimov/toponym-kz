etymology:
  - gloss: «яблочное (место)»
    language: turkic
    analysis: >-
      Алма «яблоко» + аффикс обладания -ты (вариант -лы/-ды): «место,
      где много яблок». Модель типична для тюркской топонимии
      (ср. Қарағанды, Балқашты). Подкрепляется дикими яблоневыми лесами
      Заилийского Алатау (Malus sieversii).
    reliability: high
    source: koichubaev-1974
  - gloss: Алма-Ата — «отец яблок»
    language: kazakh (искусственное)
    analysis: >-
      Форма 1921 г. создана как «алма» + «ата» («отец»). Для казахского
      языка сочетание неестественно, это административное новообразование,
      а не этимология исходного названия.
    reliability: rejected
    source: null
historical_forms:
  - form: Алмату
    script: arabic
    language: turkic
    from: 1270
    attested: 1271
    source: null
    note: Чеканка серебряных дирхемов монетного двора «Алмату», XIII в. Точную дату и публикацию уточнить.
  - form: Верный
    script: cyrillic
    language: russian
    from: 1854
    to: 1921
    official: true
    note: Укрепление Заилийское (1854), с 1855 г. — Верное, город с 1867 г.
  - form: Алма-Ата
    script: cyrillic
    language: russian
    from: 1921
    to: 1993
    official: true
  - form: Алматы
    script: cyrillic
    language: kazakh
    from: 1993
    to: null
    official: true
