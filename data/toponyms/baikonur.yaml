etymology:
  - gloss: «богатая бурая (местность)»
    language: kazakh
    analysis: >-
      Бай «богатый, обильный» + қоңыр «бурый, коричневый; также мягкий,
      благоприятный». Исходно — название посёлка в Улытауской области,
      примерно в 300 км к северо-востоку от космодрома. В 1961 г. название
      использовано для дезинформации о местоположении космодрома, в 1995 г.
      перенесено на город Ленинск.
    reliability: medium
    source: koichubaev-1974
