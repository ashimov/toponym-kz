etymology:
  - gloss: «столица»
    language: persian → kazakh
    analysis: >-
      Каз. астана «столица» восходит к перс. āstāne «порог; дворцовый порог,
      резиденция правителя». В казахском языке слово закрепилось в значении
      «столица» и в 1998 г. стало именем собственным.
    reliability: high
    source: pospelov-2002
  - gloss: Ақмола — «белая святыня / белая могила»
    language: kazakh
    analysis: >-
      Относится к прежней форме Ақмола: ақ «белый» + мола «могила, мазар»
      (арабизм через персидский). Обычно связывают с известняковым холмом
      или мавзолеем в окрестностях.
    reliability: medium
    source: koichubaev-1974
    note: Относится к форме Ақмола, а не к современному названию.
  - gloss: Ақмола — «белое изобилие» (ақ мол)
    language: kazakh
    analysis: >-
      Версия через ақ «белый; молочная пища» + мол «обильный»: место,
      изобилующее молочными продуктами. Широко цитируется в популярной
      литературе, но морфологически слабее.
    reliability: folk
    source: null
