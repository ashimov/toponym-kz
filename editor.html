<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактор карточки топонима</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/editor.css" />
  </head>
  <body class="editor-body">
    <div class="ed">
      <header class="ed-head">
        <div>
          <h1>Редактор карточки</h1>
          <p class="sub">Заполни форму, справа получится YAML. Сохрани его как <code>data/toponyms/&lt;id&gt;.yaml</code> и запусти <code>npm run validate</code>.</p>
        </div>
        <div class="ed-actions">
          <label class="btn ghost">Открыть YAML <input type="file" id="open" accept=".yaml,.yml" hidden /></label>
          <select id="load"><option value="">Загрузить существующую…</option></select>
          <a class="btn ghost" href="./">← Карта</a>
        </div>
      </header>

      <main class="ed-main">
        <form id="form" class="ed-form" autocomplete="off">
          <fieldset>
            <legend>Идентификация</legend>
            <div class="grid2">
              <label>id <small>латиница, как имя файла</small><input name="id" pattern="[a-z0-9\-]+" required placeholder="atyrau" /></label>
              <label>Статус<select name="status"><option value="draft">draft — черновик</option><option value="reviewed">reviewed — проверено</option><option value="published">published</option></select></label>
              <label>Казахский (кириллица)<input name="kk_cyr" required placeholder="Атырау" /></label>
              <label>Казахский (латиница)<input name="kk_lat" placeholder="Atyraý" /></label>
              <label>Русский<input name="ru" required placeholder="Атырау" /></label>
              <label>English<input name="en" placeholder="Atyrau" /></label>
              <label>Тип<select name="type"></select></label>
              <label>Языковой пласт<select name="layer"></select></label>
              <label>Широта<input name="lat" type="number" step="0.0001" min="40" max="56" required placeholder="47.1167" /></label>
              <label>Долгота<input name="lon" type="number" step="0.0001" min="46" max="88" required placeholder="51.8833" /></label>
              <label>Область<select name="region"><option value="">—</option></select></label>
              <label>Wikidata<input name="wikidata" pattern="Q[0-9]+" placeholder="Q486913" /></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Этимология <small>гипотезы, от надёжной к народной</small></legend>
            <div id="ety-list" class="rep"></div>
            <button type="button" class="btn small" data-add="ety">+ гипотеза</button>
          </fieldset>

          <fieldset>
            <legend>Морфемы <small>принятой гипотезы, по порядку</small></legend>
            <div id="morph-list" class="rep"></div>
            <button type="button" class="btn small" data-add="morph">+ морфема</button>
          </fieldset>

          <fieldset>
            <legend>Исторические формы</legend>
            <div id="form-list" class="rep"></div>
            <button type="button" class="btn small" data-add="form">+ форма</button>
          </fieldset>

          <fieldset>
            <legend>Источники и фото</legend>
            <label>Источники карточки <small>id из sources.yaml, через запятую</small><input name="sources" placeholder="konkashpaev-1963, pospelov-2002" /></label>
            <label>Категории Викисклада <small>по одной в строке</small><textarea name="commons_categories" rows="2" placeholder="History of Atyrau"></textarea></label>
            <label>Рабочие заметки<textarea name="notes" rows="2"></textarea></label>
          </fieldset>
        </form>

        <aside class="ed-out">
          <div class="ed-out-head">
            <span id="out-name">data/toponyms/….yaml</span>
            <button type="button" class="btn" id="copy">Копировать</button>
            <button type="button" class="btn" id="download">Скачать</button>
          </div>
          <pre id="yaml"></pre>
          <div id="problems" class="problems"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/editor.js"></script>
  </body>
</html>
